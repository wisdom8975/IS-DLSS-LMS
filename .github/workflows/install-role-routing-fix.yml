name: Install role-aware dashboard routing fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add role routing script to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='role-routing-fix.js'
          if marker not in text:
              tag='<script src="role-routing-fix.js?v=20260822-role-routing-v1"></script>'
              text=text.replace('</body>', tag+'\n</body>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit routing hook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire role-aware dashboard routing fix'
          git push