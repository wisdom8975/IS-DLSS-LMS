name: Reconnect LMS to IS-DLSS Supabase

on:
  push:
    branches: [reconnect-is-dlss]

permissions:
  contents: write

jobs:
  reconnect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace deleted Supabase project reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'https://mnypxpwcfydyqeiyigom.supabase.co'
          new = 'https://vahkwyetointavhzwfef.supabase.co'
          if old in s:
              p.write_text(s.replace(old, new))
          m = Path('supabase/migrations/20260820170000_harden_authoritative_lms_access.sql')
          if m.exists():
              t = m.read_text()
              t = t.replace('mnypxpwcfydyqeiyigom', 'vahkwyetointavhzwfef')
              m.write_text(t)
          PY
      - name: Commit connection change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase/migrations/20260820170000_harden_authoritative_lms_access.sql
          if git diff --cached --quiet; then
            echo 'No connection changes required.'
          else
            git commit -m 'fix: reconnect LMS to IS-DLSS Supabase'
            git push
          fi
