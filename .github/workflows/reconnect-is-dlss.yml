name: Reconnect LMS to IS-DLSS Supabase

on:
  push:
    branches: [reconnect-is-dlss]

permissions:
  contents: write

jobs:
  reconnect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace deleted Supabase project reference and key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('https://mnypxpwcfydyqeiyigom.supabase.co', 'https://vahkwyetointavhzwfef.supabase.co')
          s = s.replace('sb_publishable_i_o3Rk-7ry1yRBxdWu67Dw_iW4SdTIE', 'sb_publishable_gAs0e-XS4JVWNduZSBMqfw_49bLInX7')
          p.write_text(s)
          m = Path('supabase/migrations/20260820170000_harden_authoritative_lms_access.sql')
          if m.exists():
              m.write_text(m.read_text().replace('mnypxpwcfydyqeiyigom', 'vahkwyetointavhzwfef'))
          PY
      - name: Commit connection change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase/migrations/20260820170000_harden_authoritative_lms_access.sql
          if git diff --cached --quiet; then
            echo 'No connection changes required.'
          else
            git commit -m 'fix: use IS-DLSS Supabase publishable key'
            git push
          fi
