name: Apply Lesson Formatting
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe lesson formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.lesson-content{font-size:14px;line-height:1.65}', '.lesson-content{font-size:14px;line-height:1.75;white-space:pre-line;text-align:left}')
          if '.lesson-content{white-space:pre-line;text-align:left}' not in s:
              s=s.replace('.resource{min-height:145px}', '.lesson-content{white-space:pre-line;text-align:left}.resource{min-height:145px}')
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-lesson-format.yml
          git commit -m 'style: improve SHS 2 lesson formatting'
          git push
