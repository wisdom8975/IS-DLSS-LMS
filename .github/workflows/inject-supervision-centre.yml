name: Load Supervision Centre

on:
  push:
    paths:
      - 'supervision-center.js'
      - '.github/workflows/inject-supervision-centre.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add supervision centre script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="supervision-center.js?v=20260822-v1"></script>'
          if marker not in text:
              anchor = '<script src="production-finalizer.js?v=20260822-final"></script>'
              if anchor not in text:
                  raise SystemExit('production-finalizer script tag not found')
              text = text.replace(anchor, anchor + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Load interactive supervision centre'
            git push
          fi