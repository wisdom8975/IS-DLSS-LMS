<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IS-DLSS | SHS 3 Subject</title><meta name="theme-color" content="#075c3a"><style>:root{--g:#075c3a;--g2:#087f52;--gold:#d7a62a;--ink:#17312a;--muted:#65746e;--bg:#f5f8f7;--line:#dfe7e2;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(110deg,#073f2a,#0b5d3b,#087f52);color:#fff;padding:18px 24px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-weight:900}.brand small{display:block;font-size:11px;opacity:.8}.pill{background:#fff1b8;color:#5a4800;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{margin:6px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.module{display:flex;gap:14px;align-items:flex-start}.num{width:38px;height:38px;border-radius:10px;background:#e8f3ed;color:var(--g);display:grid;place-items:center;font-weight:900;flex:none}.grow{flex:1}.tag{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button,a{border:0;border-radius:9px;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#edf4f0;color:var(--g)}.bar{height:8px;background:#e5eee9;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--gold))}.panel{margin-top:16px;padding:18px;border-radius:14px;background:#f9fcfa;border:1px solid var(--line);display:none}.panel h2{margin-top:0}.resource{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.res{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.res b{display:block;font-size:12px}.res span{font-size:11px;color:var(--muted)}.status{margin-top:12px;font-size:12px;color:var(--g);font-weight:800}.empty{padding:25px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.resource{grid-template-columns:1fr 1fr}.wrap{padding:14px}.head{align-items:flex-start}.pill{display:none}}@media(max-width:430px){.resource{grid-template-columns:1fr}}</style></head><body><header><div class="head"><div class="brand">IS-DLSS <small>SHS 3 Learning Hub • Odorgonno Senior High School</small></div><span class="pill">SHS 3</span></div></header><main class="wrap"><section class="hero"><a class="secondary" href="/shs3-learning.html">← All subjects</a><h1 id="title">SHS 3 Subject</h1><p id="desc" class="muted">Select a subject from the SHS 3 learning hub.</p></section><section class="grid" id="modules"></section></main><script>const data={"Agricultural Science":{desc:'SHS 3 agricultural production, farm systems, economics and sustainability with practical application.',modules:['New Dawn Agriculture','Crop, Pig & Fish Production','Support Systems & Climate','Farm Economics, Agribusiness & Sustainability']},"Biology":{desc:'SHS 3 biology through systems, genetics, ecology, biotechnology and application-based investigation.',modules:['Mammalian & Plant Systems','Ecology, Biodiversity & Emerging Diseases','Genetics, Variation, Evolution & Cell Division','Biotechnology & Entrepreneurship']},"Chemistry":{desc:'SHS 3 chemistry through equilibria, periodicity, organic chemistry, calculations and laboratory reasoning.',modules:['Chemical Equilibria','Equilibrium Applications','Periodicity & Properties of Elements','Organic Functional Groups']},"Physics":{desc:'SHS 3 physics through mechanics, waves, energy, electricity, electronics and atomic/nuclear applications.',modules:['Mechanics, Kinematics & Dynamics','Heat, Waves & Energy','Electricity, AC & Electromagnetic Induction','Electronics, Atomic & Nuclear Physics']}};const p=new URLSearchParams(location.search);const subject=p.get('subject')||'Physics';const d=data[subject]||data.Physics;document.title='IS-DLSS | SHS 3 '+subject;document.getElementById('title').textContent='SHS 3 '+subject;document.getElementById('desc').textContent=d.desc;const root=document.getElementById('modules');root.innerHTML=d.modules.map((m,i)=>`<article class="card module"><div class="num">${i+1}</div><div class="grow"><b>${subject}: ${m}</b><div class="tag">Learning objective → instructional video → practical/inquiry activity → formative assessment</div><div class="bar"><i style="width:${i===0?42:0}%"></i></div><div class="actions"><button class="primary" onclick="openUnit(${i})">Open learning unit</button><button class="secondary" onclick="preview(${i})">Preview assessment</button></div><div class="panel" id="panel${i}"><h2>${m}</h2><p class="muted">This unit is structured for SHS 3 learners. The production version will load its authoritative lesson records and learner progress from Supabase.</p><div class="resource"><div class="res"><b>🎯 Objective</b><span>Understand and apply the topic.</span></div><div class="res"><b>🎥 Video</b><span>Topic-focused instruction.</span></div><div class="res"><b>🧪 Practical</b><span>Investigation or simulation.</span></div><div class="res"><b>📝 Assessment</b><span>Application + analysis.</span></div></div><div class="status" id="status${i}">Ready to begin</div></div></div></article>`).join('');function openUnit(i){const p=document.getElementById('panel'+i);p.style.display=p.style.display==='block'?'none':'block';if(p.style.display==='block')document.getElementById('status'+i).textContent='Learning unit opened • video → practical/inquiry → assessment → feedback';}function preview(i){const p=document.getElementById('panel'+i);p.style.display='block';document.getElementById('status'+i).textContent='Assessment preview • questions will emphasize understanding, application, analysis and practical reasoning.';p.scrollIntoView({behavior:'smooth',block:'center'});}</script></body></html>
